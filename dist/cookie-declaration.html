<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cookie Declaration</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        color: #fff;
      }

      body {
        background: transparent;
      }
    </style>
  </head>
  <body>
    <script>
      (function injectCookieDeclaration() {
        const script = document.createElement('script');
        script.id = 'CookieDeclaration';
        script.src = 'https://consent.cookiebot.com/2a475210-b203-4225-953a-af0cec101a9fe/cd.js';
        script.type = 'text/javascript';
        script.async = true;
        document.body.appendChild(script);
      })();

      (function reportHeightToParent() {
        function sendHeight() {
          const height = Math.max(
            document.documentElement.scrollHeight,
            document.body.scrollHeight
          );
          window.parent.postMessage(
            { type: 'cookieDeclarationHeight', height },
            window.location.origin
          );
        }

        window.addEventListener('load', sendHeight);
        window.addEventListener('resize', sendHeight);

        const observer = new MutationObserver(sendHeight);
        observer.observe(document.body, { childList: true, subtree: true });
      })();
    </script>
  </body>
</html>
